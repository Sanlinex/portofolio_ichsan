      <text x="637" y="185" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle">REVIEW</text>
      <text x="740" y="185" font-family="'Inter Tight', sans-serif" font-size="13" fill="#FFFFFF">Jurnalis</text>
      <text x="870" y="185" font-family="'Inter Tight', sans-serif" font-size="13" fill="#FF4D1C">Review ↗</text>

