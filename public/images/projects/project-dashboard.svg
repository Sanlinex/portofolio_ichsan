      <text x="637" y="130" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">PUBLISHED</text>
      <text x="740" y="130" font-family="'Inter Tight', sans-serif" font-size="13" fill="#FFFFFF">Rafli I.</text>
      <text x="870" y="130" font-family="'Inter Tight', sans-serif" font-size="13" fill="#FF4D1C">Edit ↗</text>

