  <!-- Sidebar Nav -->
  <rect y="48" width="220" height="752" fill="#121214" stroke-right="1px solid #27272A"/>
  <text x="24" y="90" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">TRANSISI // CMS</text>

