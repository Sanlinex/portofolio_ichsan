  <text x="48" y="265" font-family="'Inter Tight', sans-serif" font-size="13" fill="#A1A1AA">👥 Redaction Team</text>
  <text x="48" y="305" font-family="'Inter Tight', sans-serif" font-size="13" fill="#A1A1AA">⚙️ Settings</text>

