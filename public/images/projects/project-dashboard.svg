      <text x="24" y="235" font-family="'Inter Tight', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Inovasi Infrastruktur Cloud dan Penghematan Bandwidth Redaksi</text>
      <text x="24" y="251" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">ID: #ART-9839 • Kemarin</text>
      <text x="460" y="240" font-family="'Inter Tight', sans-serif" font-size="13" fill="#A1A1AA">Opini</text>
