<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B3D"/>
      <stop offset="50%" stop-color="#FF4D1C"/>
      <stop offset="100%" stop-color="#C43208"/>
    </linearGradient>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,20 Q 10,0 20,20 T 40,20" fill="none" stroke="rgba(14,14,14,0.04)" stroke-width="1"/>
      <path d="M 20,0 Q 40,10 20,20 T 20,40" fill="none" stroke="rgba(14,14,14,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Parchment Background -->
  <rect width="1200" height="850" fill="#F8F6F0"/>
  <rect width="1200" height="850" fill="url(#guilloche)"/>

  <!-- Outer Double Borders -->
  <rect x="25" y="25" width="1150" height="800" fill="none" stroke="#0E0E0E" stroke-width="3"/>
  <rect x="35" y="35" width="1130" height="780" fill="none" stroke="#FF4D1C" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="45" y="45" width="1110" height="760" fill="none" stroke="#0E0E0E" stroke-width="1"/>

  <!-- Corner Ornaments -->
  <g stroke="#0E0E0E" stroke-width="2" fill="none">
    <path d="M 45,75 L 75,75 L 75,45"/>
    <path d="M 1155,75 L 1125,75 L 1125,45"/>
    <path d="M 45,775 L 75,775 L 75,805"/>
    <path d="M 1155,775 L 1125,775 L 1125,805"/>
  </g>

  <!-- Header Header / Government Emblem Placeholder -->
  <circle cx="600" cy="115" r="32" fill="#0E0E0E"/>
  <polygon points="600,95 607,110 623,110 610,120 615,135 600,125 585,135 590,120 577,110 593,110" fill="#FF4D1C"/>

  <!-- Masthead -->
  <text x="600" y="180" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="4" fill="#0E0E0E" text-anchor="middle">PEMERINTAH KABUPATEN TANGERANG</text>
  <text x="600" y="202" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" fill="#666666" text-anchor="middle">DINAS PENDIDIKAN DAN KEBUDAYAAN</text>

  <line x1="450" y1="220" x2="750" y2="220" stroke="#0E0E0E" stroke-width="1.5"/>

  <!-- Title -->
  <text x="600" y="275" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="52" fill="#0E0E0E" text-anchor="middle">Sertifikat Penghargaan</text>
  <text x="600" y="305" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3" fill="#FF4D1C" text-anchor="middle">NO. REG: 421.3 / 089-DISDIK / 2023 [VERIFIED]</text>

  <!-- Awarded To -->
  <text x="600" y="360" font-family="'Inter Tight', sans-serif" font-size="14" fill="#666666" text-anchor="middle">DIBERIKAN KEPADA</text>
  <text x="600" y="420" font-family="'Instrument Serif', Georgia, serif" font-size="48" font-weight="bold" fill="#0E0E0E" text-anchor="middle">MUH. RAFLI ICHSAN</text>
  <line x1="380" y1="440" x2="820" y2="440" stroke="#0E0E0E" stroke-width="1"/>

  <!-- Achievement Details -->
  <text x="600" y="480" font-family="'Inter Tight', sans-serif" font-size="15" fill="#444444" text-anchor="middle">Sebagai</text>
  <text x="600" y="525" font-family="'Inter Tight', sans-serif" font-size="34" font-weight="800" fill="#FF4D1C" text-anchor="middle">JUARA 1 — WEB DEVELOPER</text>
  <text x="600" y="560" font-family="'Inter Tight', sans-serif" font-size="16" fill="#0E0E0E" text-anchor="middle">Lomba Kompetensi Siswa (LKS) Tingkat Kabupaten Tangerang</text>
  <text x="600" y="585" font-family="'Inter Tight', sans-serif" font-size="13" fill="#666666" text-anchor="middle">Bidang Keahlian: Web Technologies &amp; Software Engineering</text>

  <!-- Seal / Badge -->
  <g transform="translate(180, 640)">
    <circle cx="50" cy="50" r="46" fill="url(#goldGrad)"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="50" y="44" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">1st</text>
    <text x="50" y="60" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">PODIUM</text>
    <text x="50" y="73" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFFFFF" text-anchor="middle">TANGERANG</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(780, 640)">
    <line x1="0" y1="70" x2="240" y2="70" stroke="#0E0E0E" stroke-width="1.5"/>
    <path d="M 30,55 Q 60,10 90,65 T 150,40 T 210,65" fill="none" stroke="#0E0E0E" stroke-width="2"/>
    <text x="120" y="90" font-family="'Inter Tight', sans-serif" font-size="12" font-weight="700" fill="#0E0E0E" text-anchor="middle">KETUA PANITIA LKS KAB. TANGERANG</text>
    <text x="120" y="108" font-family="'JetBrains Mono', monospace" font-size="10" fill="#666666" text-anchor="middle">NIP. 19780512 200312 1 004</text>
  </g>

  <!-- Footer Marginalia -->
  <text x="60" y="795" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888888">VERIFIED ARCHIVE // ISSUED: 2023</text>
  <text x="1140" y="795" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888888" text-anchor="end">MUH. RAFLI ICHSAN PORTFOLIO</text>
</svg>
