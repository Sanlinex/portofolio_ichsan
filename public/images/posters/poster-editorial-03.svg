<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Inter:wght@400;600;800;900&amp;display=swap');
      .title-sans { font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; letter-spacing: -0.04em; }
      .serif-italic { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; }
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <pattern id="grid-03" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0E0E0E" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="1200" fill="#EBE7DF" />
  <rect width="900" height="1200" fill="url(#grid-03)" />

  <!-- Outer Swiss Margin Lines -->
  <rect x="50" y="50" width="800" height="1100" fill="none" stroke="#0E0E0E" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Top Masthead Header -->
  <g transform="translate(80, 100)">
    <text class="mono" font-size="14" font-weight="700" fill="#FF4D1C" letter-spacing="3">POSTER ARCHIVE // EDITION 03</text>
    <text x="740" y="0" text-anchor="end" class="mono" font-size="14" fill="#57544E" letter-spacing="2">MUH. RAFLI ICHSAN</text>
    <line x1="0" y1="20" x2="740" y2="20" stroke="#0E0E0E" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Giant Typographic Hero -->
  <g transform="translate(80, 220)">
    <text class="mono" font-size="12" fill="#57544E" letter-spacing="4" uppercase="true">SERIES INDEX</text>
    <text y="130" class="serif-italic" font-size="150" fill="#FF4D1C" opacity="0.95">03</text>
    
    <text y="240" class="title-sans" font-size="52" fill="#0E0E0E" line-height="1">
      TYPOGRAPHIC DISCIPLINE
    </text>
    <text y="300" class="title-sans" font-size="52" fill="#0E0E0E">
      
    </text>
    
    <text y="350" class="mono" font-size="15" font-weight="600" fill="#FF4D1C" letter-spacing="2">
      // DROP CAPS, MARGINALIA & RIGID GRIDS
    </text>
  </g>

  <!-- Central Graphic Construct / Architectural Geometry -->
  <g transform="translate(80, 620)">
    <!-- Asymmetric Accent Blocks -->
    <rect x="0" y="0" width="350" height="240" fill="#0E0E0E" fill-opacity="0.04" stroke="#0E0E0E" stroke-width="1" stroke-opacity="0.2" />
    <rect x="20" y="20" width="12" height="12" fill="#FF4D1C" />
    <text x="45" y="32" class="mono" font-size="11" fill="#0E0E0E" letter-spacing="1">MODULAR RATIO 1:1.618</text>
    
    <!-- Hairline Construct lines -->
    <line x1="0" y1="80" x2="350" y2="80" stroke="#0E0E0E" stroke-width="0.75" stroke-opacity="0.15" />
    <line x1="180" y1="80" x2="180" y2="240" stroke="#0E0E0E" stroke-width="0.75" stroke-opacity="0.15" />
    
    <text x="25" y="140" class="serif-italic" font-size="44" fill="#0E0E0E">Rafli.</text>
    <text x="25" y="180" class="mono" font-size="11" fill="#57544E">DESIGN DIRECTION</text>

    <!-- Adjacent Bold Accent Frame -->
    <rect x="380" y="0" width="360" height="240" fill="#FF4D1C" fill-opacity="0.12" stroke="#FF4D1C" stroke-width="1.5" />
    <text x="410" y="50" class="mono" font-size="12" font-weight="700" fill="#FF4D1C" letter-spacing="2">STRUCTURAL DISCIPLINE</text>
    <text x="410" y="100" class="title-sans" font-size="28" fill="#0E0E0E">TANGERANG // 2024</text>
    <text x="410" y="140" class="mono" font-size="11" fill="#57544E">PRINTED DIMENSIONS: 700 × 1000 MM (B1)</text>
    <text x="410" y="165" class="mono" font-size="11" fill="#57544E">GRID SYSTEM: 12-COL ASYMMETRIC</text>
    
    <!-- Barcode Element -->
    <g transform="translate(410, 190)">
      <rect x="0" y="0" width="3" height="30" fill="#0E0E0E" />
      <rect x="6" y="0" width="2" height="30" fill="#0E0E0E" />
      <rect x="11" y="0" width="6" height="30" fill="#0E0E0E" />
      <rect x="20" y="0" width="1" height="30" fill="#0E0E0E" />
      <rect x="24" y="0" width="4" height="30" fill="#0E0E0E" />
      <rect x="32" y="0" width="2" height="30" fill="#0E0E0E" />
      <rect x="38" y="0" width="8" height="30" fill="#0E0E0E" />
      <rect x="50" y="0" width="3" height="30" fill="#0E0E0E" />
      <rect x="58" y="0" width="1" height="30" fill="#0E0E0E" />
      <rect x="63" y="0" width="5" height="30" fill="#0E0E0E" />
      <rect x="72" y="0" width="2" height="30" fill="#0E0E0E" />
      <rect x="78" y="0" width="7" height="30" fill="#0E0E0E" />
      <rect x="90" y="0" width="3" height="30" fill="#0E0E0E" />
      <rect x="96" y="0" width="4" height="30" fill="#0E0E0E" />
      <text x="115" y="20" class="mono" font-size="10" fill="#57544E">8 991204 883921</text>
    </g>
  </g>

  <!-- Editorial Text Columns & Narrative Base -->
  <g transform="translate(80, 920)">
    <line x1="0" y1="0" x2="740" y2="0" stroke="#0E0E0E" stroke-width="1" stroke-opacity="0.2" />
    <text y="35" class="mono" font-size="11" font-weight="700" fill="#FF4D1C" letter-spacing="2">TECHNICAL SPECIFICATION &amp; CONCEPT STATEMENT</text>
    <text y="65" class="mono" font-size="11" fill="#57544E" letter-spacing="1">
      THE CRAFT OF CONTEMPORARY DIGITAL PRINT
    </text>
    <text y="90" class="mono" font-size="10" fill="#57544E" opacity="0.8">
      EXPLORING THE COHESION OF BOLD TYPOGRAPHY, RIGID EDITORIAL CONSTRUCTS, AND MINIMALIST CODE SYSTEMS.
    </text>
  </g>

  <!-- Bottom Colophon -->
  <g transform="translate(80, 1110)">
    <line x1="0" y1="0" x2="740" y2="0" stroke="#0E0E0E" stroke-width="1.5" stroke-opacity="0.25" />
    <text y="25" class="mono" font-size="11" fill="#0E0E0E">FOLIO // ISSUE 01</text>
    <text x="370" y="25" text-anchor="middle" class="mono" font-size="11" fill="#57544E">POSTER ARCHIVE REF: POSTER-EDITORIAL-03</text>
    <text x="740" y="25" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#FF4D1C">VERIFIED ORIGINAL</text>
  </g>
</svg>